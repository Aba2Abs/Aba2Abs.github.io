<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Wedding Seating Planner</title><style>body{margin:0;font-family:system-ui;background:#eef1f4;display:grid;place-items:center;height:100vh}.c{background:#fff;border:1px solid #d8dee4;border-radius:14px;padding:22px 26px;box-shadow:0 18px 50px #0002}.d{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2f6f5e;margin-right:8px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25}}</style></head><body><div class="c"><span class="d"></span><b>Opening private seating planner…</b><div id="e" style="font-size:11px;color:#8a3f3f;margin-top:7px"></div></div><script>(async()=>{try{let b='';for(let i=1;i<=5;i++)b+=await(await fetch(`chunk${i}.txt?v=1`,{cache:'no-store'})).text();let x=atob(b.trim()),u=Uint8Array.from(x,c=>c.charCodeAt(0)),h=new TextDecoder().decode(u);document.open();document.write(h);document.close()}catch(x){document.getElementById('e').textContent='Could not load. Refresh the page.'}})();</script></body></html>
