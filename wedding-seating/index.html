<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Ambassador Floor Planner</title><style>body{margin:0;font-family:system-ui;background:#eef1f4;display:grid;place-items:center;height:100vh}.c{background:#fff;border:1px solid #d8dee4;border-radius:14px;padding:22px 26px;box-shadow:0 18px 50px #0002}.d{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2f6f5e;margin-right:8px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25}}</style></head><body><div class="c"><span class="d"></span><b>Opening Build 10 shared seating planner…</b><div id="e" style="font-size:11px;color:#8a3f3f;margin-top:7px"></div></div><script>(async()=>{try{let b='';for(let i=1;i<=5;i++)b+=await(await fetch(`chunk${i}.txt?v=11`,{cache:'no-store'})).text();const raw=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));const h=await new Response(stream).text();document.open();document.write(h);document.close()}catch(x){console.error(x);document.getElementById('e').textContent='Could not load the planner. Refresh the page or use an updated browser.'}})();</script></body></html>
